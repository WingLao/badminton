<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="PingFang TC, Noto Sans TC, sans-serif">
  <rect width="960" height="540" fill="#ffffff"/>
  <text x="40" y="52" font-size="28" font-weight="700" fill="#1f2937">手指發力是動力鏈的最後一環</text>
  <text x="40" y="84" font-size="16" fill="#6b7280">力量由下往上傳，手指在觸球前一瞬間把速度「加」到拍頭上</text>

  <!-- Kinetic chain -->
  <g font-size="18" text-anchor="middle">
    <g fill="#e5e7eb" stroke="#9ca3af">
      <rect x="40"  y="130" width="104" height="56" rx="10"/>
      <rect x="168" y="130" width="104" height="56" rx="10"/>
      <rect x="296" y="130" width="104" height="56" rx="10"/>
      <rect x="424" y="130" width="104" height="56" rx="10"/>
      <rect x="552" y="130" width="104" height="56" rx="10"/>
      <rect x="680" y="130" width="104" height="56" rx="10"/>
    </g>
    <rect x="808" y="130" width="112" height="56" rx="10" fill="#f97316" stroke="#c2410c"/>
    <g fill="#374151">
      <text x="92"  y="165">腿</text>
      <text x="220" y="165">軀幹</text>
      <text x="348" y="165">肩</text>
      <text x="476" y="165">肘</text>
      <text x="604" y="165">前臂旋轉</text>
      <text x="732" y="165">腕</text>
    </g>
    <text x="864" y="165" fill="#ffffff" font-weight="700">手指</text>
  </g>
  <g stroke="#9ca3af" stroke-width="3" fill="#9ca3af">
    <path d="M144 158 h20"/><path d="M164 152 l8 6 l-8 6z"/>
    <path d="M272 158 h20"/><path d="M292 152 l8 6 l-8 6z"/>
    <path d="M400 158 h20"/><path d="M420 152 l8 6 l-8 6z"/>
    <path d="M528 158 h20"/><path d="M548 152 l8 6 l-8 6z"/>
    <path d="M656 158 h20"/><path d="M676 152 l8 6 l-8 6z"/>
    <path d="M784 158 h20"/><path d="M804 152 l8 6 l-8 6z"/>
  </g>
  <text x="864" y="212" font-size="14" fill="#c2410c" text-anchor="middle">最後加速＋控拍面</text>

  <!-- Grip tension timeline -->
  <text x="40" y="270" font-size="20" font-weight="700" fill="#1f2937">握拍鬆緊時序</text>
  <line x1="80" y1="470" x2="900" y2="470" stroke="#374151" stroke-width="2"/>
  <line x1="80" y1="470" x2="80" y2="290" stroke="#374151" stroke-width="2"/>
  <text x="70" y="300" font-size="14" fill="#6b7280" text-anchor="end">緊</text>
  <text x="70" y="465" font-size="14" fill="#6b7280" text-anchor="end">鬆</text>
  <!-- curve -->
  <path d="M80 440 L560 440 C600 440 610 310 640 310 C670 310 680 440 720 440 L900 440" fill="none" stroke="#f97316" stroke-width="4"/>
  <!-- contact marker -->
  <line x1="700" y1="290" x2="700" y2="470" stroke="#1f2937" stroke-dasharray="6 5"/>
  <text x="700" y="494" font-size="15" fill="#1f2937" text-anchor="middle">觸球</text><text x="640" y="300" font-size="13" fill="#c2410c" text-anchor="middle">峰值在觸球前</text>
  <text x="300" y="425" font-size="18" fill="#374151" text-anchor="middle">① 鬆：準備、引拍（掌心留空隙）</text>
  <text x="560" y="335" font-size="18" fill="#c2410c" text-anchor="end">② 緊：觸球前約 20–30 ms</text>
  <text x="800" y="425" font-size="18" fill="#374151" text-anchor="middle">③ 鬆：立即回位</text>
  <text x="40" y="526" font-size="12" fill="#9ca3af">時序參考：Pan, Kao &amp; Tsai (2024), JPES 24(9)；示意圖，非實測曲線</text>
</svg>
