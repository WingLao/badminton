<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" role="img" aria-label="心率差不多，乳酸差一倍">
<title>心率差不多，乳酸差一倍</title>
<style>
.bg{fill:#f7faf8;stroke:#d9e4df}
.t{fill:#1f2a2e;font-family:'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif;font-size:15px}
.m{fill:#5b6b70}.s{font-size:12.5px}.h{font-size:22px;font-weight:700}.b{font-weight:700}
.ln{stroke:#5b6b70}.trk{fill:#e6ece9}.court{fill:#e3efe6;stroke:#1f6f5c}
@media (prefers-color-scheme:dark){.bg{fill:#172224;stroke:#2c3b3e}.t{fill:#e6eef0}.m{fill:#9fb1b5}.ln{stroke:#9fb1b5}.trk{fill:#24312f}.court{fill:#1d3329;stroke:#7fd1a8}}
.g{transform-box:fill-box;transform-origin:left center;animation:g 8s cubic-bezier(.2,.8,.2,1) infinite both}
.v{transform-box:fill-box;transform-origin:center bottom;animation:g2 8s cubic-bezier(.2,.8,.2,1) infinite both}
.f{animation:f 8s ease infinite both}
.dash{stroke-dasharray:6 8;animation:d 1.2s linear infinite}
.pulse{transform-box:fill-box;transform-origin:center;animation:p 1.1s ease-in-out infinite}
@keyframes g{0%{transform:scaleX(0)}20%{transform:scaleX(1)}93%{transform:scaleX(1);opacity:1}100%{transform:scaleX(1);opacity:0}}
@keyframes g2{0%{transform:scaleY(0)}20%{transform:scaleY(1)}93%{transform:scaleY(1);opacity:1}100%{transform:scaleY(1);opacity:0}}
@keyframes f{0%,12%{opacity:0}25%,93%{opacity:1}100%{opacity:0}}
@keyframes d{to{stroke-dashoffset:-28}}
@keyframes p{0%,100%{transform:scale(1)}30%{transform:scale(1.18)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect class="bg" x="1" y="1" width="758" height="468" rx="18"/>
<text class="t h" x="28" y="44">心率差不多，乳酸差一倍</text>
<text class="t m s" x="28" y="68">只看心率錶，會誤判多球的訓練性質</text>
<text class="t b" x="28" y="105" text-anchor="start">平均心率（下／分）</text>
<text class="t" x="28" y="144" text-anchor="start">多球</text>
<rect class="trk" x="130" y="122" width="300" height="30" rx="5"/>
<rect class="g" x="130" y="122" width="276.0" height="30" rx="5" fill="#d1495b" style="animation-delay:0.2s"/>
<text class="t b f" x="414.0" y="143" text-anchor="start" style="animation-delay:0.5s">約 184</text>
<text class="t" x="28" y="190" text-anchor="start">模擬比賽</text>
<rect class="trk" x="130" y="168" width="300" height="30" rx="5"/>
<rect class="g" x="130" y="168" width="229.5" height="30" rx="5" fill="#2f6fd1" style="animation-delay:0.6000000000000001s"/>
<text class="t b f" x="367.5" y="189" text-anchor="start" style="animation-delay:0.9s">約 153</text>
<g class="pulse"><path d="M520 135 c-14-22-48-10-38 16 c6 14 38 34 38 34 s32-20 38-34 c10-26-24-38-38-16z" fill="#d1495b"/></g>
<text class="t s m" x="520" y="215" text-anchor="middle">心率高 ≈ 30 下</text>
<text class="t b" x="28" y="262" text-anchor="start">血乳酸（mmol/L）</text>
<rect class="v" x="60" y="353.2" width="56" height="46.8" rx="5" fill="#e07b2a" style="animation-delay:0.3s"/>
<text class="t b f" x="88" y="345.2" text-anchor="middle" style="animation-delay:0.6s">3.6</text>
<text class="t s m" x="88" y="420" text-anchor="middle">10 秒</text>
<rect class="v" x="155" y="327.2" width="56" height="72.8" rx="5" fill="#e07b2a" style="animation-delay:0.6499999999999999s"/>
<text class="t b f" x="183" y="319.2" text-anchor="middle" style="animation-delay:0.95s">5.6</text>
<text class="t s m" x="183" y="420" text-anchor="middle">30 秒</text>
<rect class="v" x="250" y="305.1" width="56" height="94.9" rx="5" fill="#e07b2a" style="animation-delay:1.0s"/>
<text class="t b f" x="278" y="297.1" text-anchor="middle" style="animation-delay:1.2999999999999998s">7.3</text>
<text class="t s m" x="278" y="420" text-anchor="middle">50 秒</text>
<text class="t b" x="430" y="262" text-anchor="start">每分鐘移動距離（m）</text>
<text class="t s" x="430" y="306" text-anchor="start">10 秒間歇</text>
<rect class="trk" x="520" y="285" width="200" height="30" rx="5"/>
<rect class="g" x="520" y="285" width="190.0" height="30" rx="5" fill="#1f8a5c" style="animation-delay:0.4s"/>
<text class="t b f" x="526" y="306" text-anchor="start" style="fill:#fff;animation-delay:0.8s">約 76</text>
<text class="t s" x="430" y="352" text-anchor="start">50 秒間歇</text>
<rect class="trk" x="520" y="331" width="200" height="30" rx="5"/>
<rect class="g" x="520" y="331" width="162.5" height="30" rx="5" fill="#9aa8ab" style="animation-delay:0.8s"/>
<text class="t b f" x="526" y="352" text-anchor="start" style="fill:#fff;animation-delay:1.2000000000000002s">約 65</text>
<text class="t m s" x="28" y="448" text-anchor="start">資料：心率 Alvarez-Dacal 2025；乳酸與移動 Edel 2023（第 01 章第 1、2 篇）。單次負荷研究，不代表長期效果。</text>

</svg>
