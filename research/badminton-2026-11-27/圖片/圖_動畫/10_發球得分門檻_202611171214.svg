<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 405" role="img" aria-label="一局發球方得幾分，大概就知道勝負">
<title>一局發球方得幾分，大概就知道勝負</title>
<style>
.bg{fill:#f7faf8;stroke:#d9e4df}
.t{fill:#1f2a2e;font-family:'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif;font-size:15px}
.m{fill:#5b6b70}.s{font-size:12.5px}.h{font-size:22px;font-weight:700}.b{font-weight:700}
.ln{stroke:#5b6b70}.trk{fill:#e6ece9}.court{fill:#e3efe6;stroke:#1f6f5c}
@media (prefers-color-scheme:dark){.bg{fill:#172224;stroke:#2c3b3e}.t{fill:#e6eef0}.m{fill:#9fb1b5}.ln{stroke:#9fb1b5}.trk{fill:#24312f}.court{fill:#1d3329;stroke:#7fd1a8}}
.g{transform-box:fill-box;transform-origin:left center;animation:g 8s cubic-bezier(.2,.8,.2,1) infinite both}
.v{transform-box:fill-box;transform-origin:center bottom;animation:g2 8s cubic-bezier(.2,.8,.2,1) infinite both}
.f{animation:f 8s ease infinite both}
.dash{stroke-dasharray:6 8;animation:d 1.2s linear infinite}
.pulse{transform-box:fill-box;transform-origin:center;animation:p 1.1s ease-in-out infinite}
@keyframes g{0%{transform:scaleX(0)}20%{transform:scaleX(1)}93%{transform:scaleX(1);opacity:1}100%{transform:scaleX(1);opacity:0}}
@keyframes g2{0%{transform:scaleY(0)}20%{transform:scaleY(1)}93%{transform:scaleY(1);opacity:1}100%{transform:scaleY(1);opacity:0}}
@keyframes f{0%,12%{opacity:0}25%,93%{opacity:1}100%{opacity:0}}
@keyframes d{to{stroke-dashoffset:-28}}
@keyframes p{0%,100%{transform:scale(1)}30%{transform:scale(1.18)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect class="bg" x="1" y="1" width="758" height="403" rx="18"/>
<text class="t h" x="28" y="44">一局發球方得幾分，大概就知道勝負</text>
<text class="t m s" x="28" y="68">決策樹分析：發球回合得分，是與勝負最相關的指標</text>
<text class="t b h" x="28" y="134" text-anchor="start">男單</text>
<rect x="120" y="110" width="226.7" height="34" fill="#d1495b" opacity=".75" rx="4"/><rect x="346.7" y="110" width="106.7" height="34" class="trk"/><rect x="453.3" y="110" width="226.7" height="34" fill="#1f8a5c" opacity=".8" rx="4"/>
<text class="t s m" x="120.0" y="164" text-anchor="middle">0</text>
<text class="t s m" x="200.0" y="164" text-anchor="middle">3</text>
<text class="t s m" x="280.0" y="164" text-anchor="middle">6</text>
<text class="t s m" x="360.0" y="164" text-anchor="middle">9</text>
<text class="t s m" x="440.0" y="164" text-anchor="middle">12</text>
<text class="t s m" x="520.0" y="164" text-anchor="middle">15</text>
<text class="t s m" x="600.0" y="164" text-anchor="middle">18</text>
<text class="t s m" x="680.0" y="164" text-anchor="middle">21</text>
<g><path d="M0 -8 L8 -20 L-8 -20 Z" fill="#1f6f5c"/><animateTransform attributeName="transform" type="translate" values="120,110;226.66666666666669,110;520.0,110;386.6666666666667,110;120,110" dur="6s" repeatCount="indefinite"/></g>
<text class="t s b" x="120" y="188" text-anchor="start" fill="#d1495b">≤8 分：100% 敗方</text>
<text class="t s b" x="680" y="188" text-anchor="end" fill="#1f8a5c">≥13 分：100% 勝方</text>
<text class="t b h" x="28" y="254" text-anchor="start">女單</text>
<rect x="120" y="230" width="173.3" height="34" fill="#d1495b" opacity=".75" rx="4"/><rect x="293.3" y="230" width="160.0" height="34" class="trk"/><rect x="453.3" y="230" width="226.7" height="34" fill="#1f8a5c" opacity=".8" rx="4"/>
<text class="t s m" x="120.0" y="284" text-anchor="middle">0</text>
<text class="t s m" x="200.0" y="284" text-anchor="middle">3</text>
<text class="t s m" x="280.0" y="284" text-anchor="middle">6</text>
<text class="t s m" x="360.0" y="284" text-anchor="middle">9</text>
<text class="t s m" x="440.0" y="284" text-anchor="middle">12</text>
<text class="t s m" x="520.0" y="284" text-anchor="middle">15</text>
<text class="t s m" x="600.0" y="284" text-anchor="middle">18</text>
<text class="t s m" x="680.0" y="284" text-anchor="middle">21</text>
<g><path d="M0 -8 L8 -20 L-8 -20 Z" fill="#1f6f5c"/><animateTransform attributeName="transform" type="translate" values="120,230;226.66666666666669,230;520.0,230;386.6666666666667,230;120,230" dur="6s" repeatCount="indefinite"/></g>
<text class="t s b" x="120" y="308" text-anchor="start" fill="#d1495b">≤6 分：100% 敗方</text>
<text class="t s b" x="680" y="308" text-anchor="end" fill="#1f8a5c">≥13 分：97.4% 勝方</text>
<text class="t s m" x="28" y="360" text-anchor="start">「發球得分」= 發球方贏下該分的次數（一局）。觀察資料，屬結果指標，不是因果。</text>
<text class="t m s" x="28" y="384" text-anchor="start">資料：나경민等 2020，BWF 15 項國際賽、男女單各 50 場（第 10 章）。</text>

</svg>
