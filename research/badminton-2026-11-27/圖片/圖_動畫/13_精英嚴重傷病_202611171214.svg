<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 572" role="img" aria-label="最大缺口不是受傷，而是復出管理">
<title>最大缺口不是受傷，而是復出管理</title>
<style>
.bg{fill:#f7faf8;stroke:#d9e4df}
.t{fill:#1f2a2e;font-family:'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif;font-size:15px}
.m{fill:#5b6b70}.s{font-size:12.5px}.h{font-size:22px;font-weight:700}.b{font-weight:700}
.ln{stroke:#5b6b70}.trk{fill:#e6ece9}.court{fill:#e3efe6;stroke:#1f6f5c}
@media (prefers-color-scheme:dark){.bg{fill:#172224;stroke:#2c3b3e}.t{fill:#e6eef0}.m{fill:#9fb1b5}.ln{stroke:#9fb1b5}.trk{fill:#24312f}.court{fill:#1d3329;stroke:#7fd1a8}}
.g{transform-box:fill-box;transform-origin:left center;animation:g 8s cubic-bezier(.2,.8,.2,1) infinite both}
.v{transform-box:fill-box;transform-origin:center bottom;animation:g2 8s cubic-bezier(.2,.8,.2,1) infinite both}
.f{animation:f 8s ease infinite both}
.dash{stroke-dasharray:6 8;animation:d 1.2s linear infinite}
.pulse{transform-box:fill-box;transform-origin:center;animation:p 1.1s ease-in-out infinite}
@keyframes g{0%{transform:scaleX(0)}20%{transform:scaleX(1)}93%{transform:scaleX(1);opacity:1}100%{transform:scaleX(1);opacity:0}}
@keyframes g2{0%{transform:scaleY(0)}20%{transform:scaleY(1)}93%{transform:scaleY(1);opacity:1}100%{transform:scaleY(1);opacity:0}}
@keyframes f{0%,12%{opacity:0}25%,93%{opacity:1}100%{opacity:0}}
@keyframes d{to{stroke-dashoffset:-28}}
@keyframes p{0%,100%{transform:scale(1)}30%{transform:scale(1.18)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect class="bg" x="1" y="1" width="758" height="570" rx="18"/>
<text class="t h" x="28" y="44">最大缺口不是受傷，而是復出管理</text>
<text class="t m s" x="28" y="68">三分之二選手沒等醫生批准就回場</text>
<text class="t s" x="28" y="111" text-anchor="start">曾有嚴重傷（停訓 ≥28 日）</text>
<rect class="trk" x="250" y="92" width="400" height="26" rx="5"/>
<rect class="g" x="250" y="92" width="231.6" height="26" rx="5" fill="#d1495b" style="animation-delay:0.2s"/>
<text class="t b f" x="489.6" y="111" text-anchor="start" style="animation-delay:0.5s">57.9%</text>
<text class="t s" x="28" y="151" text-anchor="start">發生在下肢</text>
<rect class="trk" x="250" y="132" width="400" height="26" rx="5"/>
<rect class="g" x="250" y="132" width="312.8" height="26" rx="5" fill="#e07b2a" style="animation-delay:0.45s"/>
<text class="t b f" x="570.8" y="151" text-anchor="start" style="animation-delay:0.75s">78.2%</text>
<text class="t s" x="28" y="191" text-anchor="start">過度使用型</text>
<rect class="trk" x="250" y="172" width="400" height="26" rx="5"/>
<rect class="g" x="250" y="172" width="257.6" height="26" rx="5" fill="#7a4fd0" style="animation-delay:0.7s"/>
<text class="t b f" x="515.6" y="191" text-anchor="start" style="animation-delay:1.0s">64.4%</text>
<text class="t s" x="28" y="231" text-anchor="start">訓練中發生</text>
<rect class="trk" x="250" y="212" width="400" height="26" rx="5"/>
<rect class="g" x="250" y="212" width="280.4" height="26" rx="5" fill="#2f6fd1" style="animation-delay:0.95s"/>
<text class="t b f" x="538.4" y="231" text-anchor="start" style="animation-delay:1.25s">70.1%</text>
<text class="t s b" x="28" y="271" text-anchor="start">首次復出前沒有醫生批准</text>
<rect class="trk" x="250" y="252" width="400" height="26" rx="5"/>
<rect class="g" x="250" y="252" width="266.8" height="26" rx="5" fill="#d1495b" style="animation-delay:1.2s"/>
<text class="t b f" x="524.8" y="271" text-anchor="start" style="animation-delay:1.5s">66.7%</text>
<text class="t s b" x="28" y="311" text-anchor="start">有再傷史</text>
<rect class="trk" x="250" y="292" width="400" height="26" rx="5"/>
<rect class="g" x="250" y="292" width="211.6" height="26" rx="5" fill="#d1495b" style="animation-delay:1.45s"/>
<text class="t b f" x="469.6" y="311" text-anchor="start" style="animation-delay:1.75s">52.9%</text>
<text class="t b" x="28" y="360" text-anchor="start">五大診斷（例數）</text>
<rect class="v" x="40" y="401.0" width="60" height="99.0" rx="5" fill="#e07b2a" style="animation-delay:0.3s"/>
<text class="t b f" x="70" y="395.0" text-anchor="middle" style="animation-delay:0.6s">18</text>
<text class="t s" x="70" y="520" text-anchor="middle">髕腱病變</text>
<rect class="v" x="180" y="428.5" width="60" height="71.5" rx="5" fill="#e07b2a" style="animation-delay:0.5s"/>
<text class="t b f" x="210" y="422.5" text-anchor="middle" style="animation-delay:0.8s">13</text>
<text class="t s" x="210" y="520" text-anchor="middle">小腿肌撕裂</text>
<rect class="v" x="320" y="434.0" width="60" height="66.0" rx="5" fill="#e07b2a" style="animation-delay:0.7s"/>
<text class="t b f" x="350" y="428.0" text-anchor="middle" style="animation-delay:1.0s">12</text>
<text class="t s" x="350" y="520" text-anchor="middle">跟腱傷</text>
<rect class="v" x="460" y="456.0" width="60" height="44.0" rx="5" fill="#e07b2a" style="animation-delay:0.9s"/>
<text class="t b f" x="490" y="450.0" text-anchor="middle" style="animation-delay:1.2000000000000002s">8</text>
<text class="t s" x="490" y="520" text-anchor="middle">腘繩肌拉傷</text>
<rect class="v" x="600" y="456.0" width="60" height="44.0" rx="5" fill="#e07b2a" style="animation-delay:1.1s"/>
<text class="t b f" x="630" y="450.0" text-anchor="middle" style="animation-delay:1.4s">8</text>
<text class="t s" x="630" y="520" text-anchor="middle">旋轉肌袖傷</text>
<text class="t m s" x="28" y="552" text-anchor="start">資料：韓國大學／職業隊 126 名精英選手回顧問卷（2026，第 13 章）。回顧性資料，有回憶偏差。</text>

</svg>
