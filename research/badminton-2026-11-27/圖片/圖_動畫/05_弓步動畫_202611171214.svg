<g opacity="0"><line x1="442" y1="300" x2="410" y2="205" stroke="#d1495b" stroke-width="6"/><path d="M403 196 L420 207 L404 214 Z" fill="#d1495b"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.4;0.46;0.62;0.7;1" dur="3.2s" repeatCount="indefinite"/></g>
<g opacity="0"><text class="t b" x="420" y="190" fill="#d1495b">地面反作用力</text><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.4;0.46;0.62;0.7;1" dur="3.2s" repeatCount="indefinite"/></g>
<g opacity="0"><text class="t b" x="470" y="250">煞車期：股四頭肌離心收縮</text><animate attributeName="opacity" values="0;0;1;0;0;0" keyTimes="0;0.4;0.46;0.62;0.7;1" dur="3.2s" repeatCount="indefinite"/></g>
<g opacity="0"><text class="t b" x="470" y="250">推蹬期：蹬回中心</text><animate attributeName="opacity" values="0;0;0;1;0;0" keyTimes="0;0.4;0.46;0.62;0.7;1" dur="3.2s" repeatCount="indefinite"/></g>
<text class="t s" x="28" y="345" text-anchor="start">• 韓國精英嚴重傷：最常聯想的動作是弓步（32.2%）——第 13 章</text>
<text class="t s" x="28" y="369" text-anchor="start">• 5° 外側楔形鞋：前弓步煞車期垂直力 +3.86%、水平力 +7.77%——第 10 章</text>
<text class="t s" x="28" y="393" text-anchor="start">• 中底越厚 ≠ 越減震：三種厚度的衝擊力峰值無差異——第 10 章</text>

