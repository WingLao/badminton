<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" role="img" aria-label="間歇越長，糖解（乳酸）越多">
<title>間歇越長，糖解（乳酸）越多</title>
<style>
.bg{fill:#f7faf8;stroke:#d9e4df}
.t{fill:#1f2a2e;font-family:'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif;font-size:15px}
.m{fill:#5b6b70}.s{font-size:12.5px}.h{font-size:22px;font-weight:700}.b{font-weight:700}
.ln{stroke:#5b6b70}.trk{fill:#e6ece9}.court{fill:#e3efe6;stroke:#1f6f5c}
@media (prefers-color-scheme:dark){.bg{fill:#172224;stroke:#2c3b3e}.t{fill:#e6eef0}.m{fill:#9fb1b5}.ln{stroke:#9fb1b5}.trk{fill:#24312f}.court{fill:#1d3329;stroke:#7fd1a8}}
.g{transform-box:fill-box;transform-origin:left center;animation:g 8s cubic-bezier(.2,.8,.2,1) infinite both}
.v{transform-box:fill-box;transform-origin:center bottom;animation:g2 8s cubic-bezier(.2,.8,.2,1) infinite both}
.f{animation:f 8s ease infinite both}
.dash{stroke-dasharray:6 8;animation:d 1.2s linear infinite}
.pulse{transform-box:fill-box;transform-origin:center;animation:p 1.1s ease-in-out infinite}
@keyframes g{0%{transform:scaleX(0)}20%{transform:scaleX(1)}93%{transform:scaleX(1);opacity:1}100%{transform:scaleX(1);opacity:0}}
@keyframes g2{0%{transform:scaleY(0)}20%{transform:scaleY(1)}93%{transform:scaleY(1);opacity:1}100%{transform:scaleY(1);opacity:0}}
@keyframes f{0%,12%{opacity:0}25%,93%{opacity:1}100%{opacity:0}}
@keyframes d{to{stroke-dashoffset:-28}}
@keyframes p{0%,100%{transform:scale(1)}30%{transform:scale(1.18)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect class="bg" x="1" y="1" width="758" height="418" rx="18"/>
<text class="t h" x="28" y="44">間歇越長，糖解（乳酸）越多</text>
<text class="t m s" x="28" y="68">同樣是多球，工作時間改變了身體用哪一種能量</text>
<text class="t b" x="28" y="142" text-anchor="start">比賽（訓練賽）</text>
<rect class="trk" x="230" y="120" width="470" height="34" rx="5"/>
<rect class="g" x="230" y="120" width="202.1" height="34" rx="0" fill="#e07b2a" style="animation-delay:0.2s"/>
<text class="t b f" x="331.05" y="142" text-anchor="middle" style="fill:#fff;animation-delay:0.6000000000000001s">43%</text>
<rect class="g" x="432.1" y="120" width="267.9" height="34" rx="0" fill="#2f6fd1" style="animation-delay:0.55s"/>
<text class="t b f" x="566.05" y="142" text-anchor="middle" style="fill:#fff;animation-delay:0.9500000000000001s">57%</text>
<text class="t b" x="28" y="220" text-anchor="start">多球 10 秒／10 秒</text>
<rect class="trk" x="230" y="198" width="470" height="34" rx="5"/>
<rect class="g" x="230" y="198" width="239.7" height="34" rx="0" fill="#e07b2a" style="animation-delay:0.7s"/>
<text class="t b f" x="349.85" y="220" text-anchor="middle" style="fill:#fff;animation-delay:1.1s">51%</text>
<rect class="g" x="469.7" y="198" width="9.4" height="34" rx="0" fill="#d1495b" style="animation-delay:1.0499999999999998s"/>
<rect class="g" x="479.09999999999997" y="198" width="220.9" height="34" rx="0" fill="#2f6fd1" style="animation-delay:1.4s"/>
<text class="t b f" x="589.55" y="220" text-anchor="middle" style="fill:#fff;animation-delay:1.7999999999999998s">47%</text>
<text class="t b" x="28" y="298" text-anchor="start">多球 50 秒／50 秒</text>
<rect class="trk" x="230" y="276" width="470" height="34" rx="5"/>
<rect class="g" x="230" y="276" width="145.7" height="34" rx="0" fill="#e07b2a" style="animation-delay:1.2s"/>
<text class="t b f" x="302.85" y="298" text-anchor="middle" style="fill:#fff;animation-delay:1.6s">31%</text>
<rect class="g" x="375.7" y="276" width="56.4" height="34" rx="0" fill="#d1495b" style="animation-delay:1.5499999999999998s"/>
<text class="t b f" x="403.9" y="298" text-anchor="middle" style="fill:#fff;animation-delay:1.9499999999999997s">12%</text>
<rect class="g" x="432.09999999999997" y="276" width="267.9" height="34" rx="0" fill="#2f6fd1" style="animation-delay:1.9s"/>
<text class="t b f" x="566.05" y="298" text-anchor="middle" style="fill:#fff;animation-delay:2.3s">57%</text>
<rect x="28" y="360" width="14" height="14" rx="3" fill="#e07b2a"/><text class="t s" x="48" y="372" text-anchor="start">磷酸肌酸（爆發，數秒）</text>
<rect x="268" y="360" width="14" height="14" rx="3" fill="#d1495b"/><text class="t s" x="288" y="372" text-anchor="start">糖解（產生乳酸）</text>
<rect x="508" y="360" width="14" height="14" rx="3" fill="#2f6fd1"/><text class="t s" x="528" y="372" text-anchor="start">有氧／氧化（回合間恢復）</text>
<text class="t m s" x="28" y="400" text-anchor="start">資料：Edel 等 2024（第 01 章第 3 篇）。比例為模型估算；多球兩列的有氧比例 = 100% − 其餘兩項。</text>

</svg>
