<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-label="預防受傷：肌力訓練 > 平衡訓練 >> 伸展">
<title>預防受傷：肌力訓練 > 平衡訓練 >> 伸展</title>
<style>
.bg{fill:#f7faf8;stroke:#d9e4df}
.t{fill:#1f2a2e;font-family:'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif;font-size:15px}
.m{fill:#5b6b70}.s{font-size:12.5px}.h{font-size:22px;font-weight:700}.b{font-weight:700}
.ln{stroke:#5b6b70}.trk{fill:#e6ece9}.court{fill:#e3efe6;stroke:#1f6f5c}
@media (prefers-color-scheme:dark){.bg{fill:#172224;stroke:#2c3b3e}.t{fill:#e6eef0}.m{fill:#9fb1b5}.ln{stroke:#9fb1b5}.trk{fill:#24312f}.court{fill:#1d3329;stroke:#7fd1a8}}
.g{transform-box:fill-box;transform-origin:left center;animation:g 8s cubic-bezier(.2,.8,.2,1) infinite both}
.v{transform-box:fill-box;transform-origin:center bottom;animation:g2 8s cubic-bezier(.2,.8,.2,1) infinite both}
.f{animation:f 8s ease infinite both}
.dash{stroke-dasharray:6 8;animation:d 1.2s linear infinite}
.pulse{transform-box:fill-box;transform-origin:center;animation:p 1.1s ease-in-out infinite}
@keyframes g{0%{transform:scaleX(0)}20%{transform:scaleX(1)}93%{transform:scaleX(1);opacity:1}100%{transform:scaleX(1);opacity:0}}
@keyframes g2{0%{transform:scaleY(0)}20%{transform:scaleY(1)}93%{transform:scaleY(1);opacity:1}100%{transform:scaleY(1);opacity:0}}
@keyframes f{0%,12%{opacity:0}25%,93%{opacity:1}100%{opacity:0}}
@keyframes d{to{stroke-dashoffset:-28}}
@keyframes p{0%,100%{transform:scale(1)}30%{transform:scale(1.18)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect class="bg" x="1" y="1" width="758" height="398" rx="18"/>
<text class="t h" x="28" y="44">預防受傷：肌力訓練 > 平衡訓練 >> 伸展</text>
<text class="t m s" x="28" y="68">100 個本來會受傷的人，練了之後剩多少？</text>
<text class="t" x="28" y="122" text-anchor="start">沒有介入（基準）</text>
<rect class="trk" x="230" y="100" width="400" height="32" rx="5"/>
<rect class="g" x="230" y="100" width="400.0" height="32" rx="5" fill="#9aa8ab" style="animation-delay:0.2s"/>
<text class="t b f" x="640.0" y="122" text-anchor="start" style="animation-delay:0.6s">100 人</text>
<text class="t b" x="28" y="172" text-anchor="start">肌力訓練</text>
<rect class="trk" x="230" y="150" width="400" height="32" rx="5"/>
<rect class="g" x="230" y="150" width="126.0" height="32" rx="5" fill="#1f8a5c" style="animation-delay:0.55s"/>
<text class="t b f" x="432.0" y="172" text-anchor="start" style="animation-delay:0.95s">32 人</text>
<text class="t" x="28" y="222" text-anchor="start">本體感覺（平衡）訓練</text>
<rect class="trk" x="230" y="200" width="400" height="32" rx="5"/>
<rect class="g" x="230" y="200" width="220.0" height="32" rx="5" fill="#2f6fd1" style="animation-delay:0.8999999999999999s"/>
<text class="t b f" x="460.0" y="222" text-anchor="start" style="animation-delay:1.2999999999999998s">55 人</text>
<text class="t" x="28" y="272" text-anchor="start">伸展</text>
<rect class="trk" x="230" y="250" width="400" height="32" rx="5"/>
<rect class="g" x="230" y="250" width="385.2" height="32" rx="5" fill="#e07b2a" style="animation-delay:1.2499999999999998s"/>
<text class="t b f" x="625.2" y="272" text-anchor="start" style="animation-delay:1.65s">96 人</text>
<line x1="313" y1="166" x2="422" y2="166" stroke="#1f6f5c" stroke-width="3"/>
<text class="t s m" x="28" y="330" text-anchor="start">讀法：原本會受傷 100 人的團隊，換成該訓練後預期約剩幾人受傷（相對風險 RR × 100）。</text>
<text class="t s m" x="28" y="352" text-anchor="start">肌力訓練 RR 0.315（95% CI 0.207–0.480，深綠橫線）；伸展 RR 0.963 = 幾乎沒有預防效果。</text>
<text class="t m s" x="28" y="380" text-anchor="start">資料：Lauersen、Bertelsen 與 Andersen 2014，BJSM，25 項隨機試驗、26,610 人（第 05 章）。非羽球專項。</text>

</svg>
