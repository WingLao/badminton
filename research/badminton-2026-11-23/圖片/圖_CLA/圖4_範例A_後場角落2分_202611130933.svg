<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 450" width="760" height="450" font-family="PingFang TC, Noto Sans TC, Microsoft JhengHei, sans-serif">
  <defs>
    <marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
  </defs>
  <rect width="760" height="450" fill="#ffffff"/>
  <text x="380" y="32" text-anchor="middle" font-size="21" font-weight="700" fill="#1f2937">範例 A：後場角落 2 分（單打，俯視圖）</text>
  <!-- court 13.4 x 6.1 m, 50 px/m -->
  <rect x="45" y="70" width="670" height="305" fill="#e0f2e9" stroke="#1f2937" stroke-width="2"/>
  <!-- 2-point zones (back 2.3 m x 1.35 m corners inside singles lines) -->
  <g fill="#f59e0b" fill-opacity="0.55" stroke="#b45309" stroke-width="1.5">
    <rect x="45" y="93" width="115" height="68"/>
    <rect x="45" y="284" width="115" height="68"/>
    <rect x="600" y="93" width="115" height="68"/>
    <rect x="600" y="284" width="115" height="68"/>
  </g>
  <g font-size="15" font-weight="700" fill="#78350f" text-anchor="middle">
    <text x="102" y="133">2 分</text><text x="102" y="324">2 分</text>
    <text x="657" y="133">2 分</text><text x="657" y="324">2 分</text>
  </g>
  <!-- lines -->
  <g stroke="#ffffff" stroke-width="2.5">
    <line x1="45" y1="93" x2="715" y2="93"/>
    <line x1="45" y1="352" x2="715" y2="352"/>
    <line x1="281" y1="70" x2="281" y2="375"/>
    <line x1="479" y1="70" x2="479" y2="375"/>
    <line x1="83" y1="70" x2="83" y2="375"/>
    <line x1="677" y1="70" x2="677" y2="375"/>
    <line x1="45" y1="222" x2="281" y2="222"/>
    <line x1="479" y1="222" x2="715" y2="222"/>
  </g>
  <line x1="380" y1="62" x2="380" y2="383" stroke="#111827" stroke-width="4"/>
  <text x="380" y="56" text-anchor="middle" font-size="12" fill="#111827">網</text>
  <!-- players -->
  <circle cx="200" cy="222" r="13" fill="#2563eb"/>
  <text x="200" y="227" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">A</text>
  <circle cx="545" cy="200" r="13" fill="#6b7280"/>
  <text x="545" y="205" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">B</text>
  <!-- shot -->
  <path d="M212,214 Q420,150 640,312" fill="none" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#h)"/>
  <text x="440" y="168" font-size="13" fill="#b91c1c">殺/劈吊進角落</text>
  <!-- legend -->
  <rect x="45" y="395" width="16" height="16" fill="#f59e0b" fill-opacity="0.55" stroke="#b45309"/>
  <text x="68" y="408" font-size="13" fill="#374151">落地 = 2 分</text>
  <text x="170" y="408" font-size="13" fill="#374151">其他區域 = 1 分</text>
  <text x="300" y="408" font-size="13" fill="#374151">回高遠被殺死 = 對手 2 分</text>
  <text x="45" y="434" font-size="13" fill="#6b7280">目標行為：主動拉四角、可攻球就進攻　指標：後場角落落點比例 %、可攻球進攻率 %</text>
</svg>
