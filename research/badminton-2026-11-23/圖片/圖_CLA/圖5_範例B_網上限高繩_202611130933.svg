<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" font-family="PingFang TC, Noto Sans TC, Microsoft JhengHei, sans-serif">
  <defs>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
  </defs>
  <rect width="760" height="380" fill="#ffffff"/>
  <text x="380" y="32" text-anchor="middle" font-size="21" font-weight="700" fill="#1f2937">範例 B：網上 30 cm 限高繩（雙打，側視圖）</text>
  <!-- floor -->
  <line x1="40" y1="300" x2="720" y2="300" stroke="#1f2937" stroke-width="2"/>
  <!-- short service line ticks -->
  <g stroke="#1f2937" stroke-width="2"><line x1="250" y1="294" x2="250" y2="306"/><line x1="510" y1="294" x2="510" y2="306"/></g>
  <text x="250" y="324" text-anchor="middle" font-size="12" fill="#374151">前發球線</text>
  <text x="510" y="324" text-anchor="middle" font-size="12" fill="#374151">前發球線</text>
  <rect x="250" y="300" width="130" height="14" fill="#3b82f6" fill-opacity="0.25"/>
  <text x="315" y="345" text-anchor="middle" font-size="12" fill="#1d4ed8">此區擊球得分 ×2</text>
  <!-- net -->
  <rect x="376" y="148" width="8" height="152" fill="#9ca3af"/>
  <text x="400" y="230" font-size="12" fill="#4b5563">網 1.524 m</text>
  <!-- valid window -->
  <rect x="368" y="118" width="24" height="30" fill="#10b981" fill-opacity="0.3" stroke="#059669" stroke-dasharray="3 3"/>
  <line x1="340" y1="118" x2="420" y2="118" stroke="#dc2626" stroke-width="3" stroke-dasharray="6 4"/>
  <text x="336" y="123" text-anchor="end" font-size="12" font-weight="700" fill="#b91c1c">限高繩</text>
  <text x="396" y="172" font-size="12" font-weight="700" fill="#047857">← 有效通道 30 cm</text>
  <!-- trajectories -->
  <path d="M180,170 Q380,81 580,200" fill="none" stroke="#059669" stroke-width="2.5" marker-end="url(#g)"/>
  <path d="M180,170 Q380,-25 600,260" fill="none" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#r)"/>
  <text x="545" y="180" font-size="13" font-weight="700" fill="#047857">✓ 壓低平抽</text>
  <text x="560" y="88" font-size="13" font-weight="700" fill="#b91c1c">✕ 高於繩 → 對手直接得分</text>
  <!-- players -->
  <g stroke="#2563eb" stroke-width="3" fill="none">
    <circle cx="160" cy="205" r="10" fill="#2563eb"/>
    <line x1="160" y1="215" x2="160" y2="260"/><line x1="160" y1="260" x2="145" y2="298"/><line x1="160" y1="260" x2="175" y2="298"/>
    <line x1="160" y1="228" x2="180" y2="172"/>
  </g>
  <text x="160" y="322" text-anchor="middle" font-size="13" fill="#1d4ed8">前場球員</text><text x="640" y="322" text-anchor="middle" font-size="13" fill="#4b5563">對手</text>
  <g stroke="#6b7280" stroke-width="3" fill="none">
    <circle cx="640" cy="205" r="10" fill="#6b7280"/>
    <line x1="640" y1="215" x2="640" y2="260"/><line x1="640" y1="260" x2="625" y2="298"/><line x1="640" y1="260" x2="655" y2="298"/>
  </g>
  <text x="40" y="368" font-size="13" fill="#6b7280">目標行為：搶網、提早擊球點、平抽壓低　指標：觸球點距網距離、過網高度、搶網成功率</text>
</svg>
